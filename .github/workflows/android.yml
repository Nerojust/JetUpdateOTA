name: Android

on:
  push:
    paths:
      - 'ota-core/**'
      - 'ota-network/**'
      - 'ota-download/**'
      - 'ota-install/**'
      - 'ota-testing/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  pull_request:
    paths:
      - 'ota-core/**'
      - 'ota-network/**'
      - 'ota-download/**'
      - 'ota-install/**'
      - 'ota-testing/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew ktlintCheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew test
