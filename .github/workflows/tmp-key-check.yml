name: Temp Key Check

on:
  workflow_dispatch:

jobs:
  check-key:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the stored key (no content printed)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" > /tmp/key.asc
          echo "byte count:"
          wc -c /tmp/key.asc
          echo "line count:"
          wc -l /tmp/key.asc
          echo "SIGNING_KEY_ID length: ${#SIGNING_KEY_ID}"
          echo "SIGNING_KEY_PASSWORD length: ${#SIGNING_KEY_PASSWORD}"
          echo "---"
          echo "gpg --show-keys result:"
          gpg --show-keys /tmp/key.asc 2>&1
          echo "---"
          echo "Attempting to unlock with the password (loopback, no real agent needed for this check):"
          gpg --pinentry-mode loopback --batch --passphrase "$SIGNING_KEY_PASSWORD" --import /tmp/key.asc 2>&1
          echo "import exit code: $?"
          rm -f /tmp/key.asc
