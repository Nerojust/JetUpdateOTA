name: Temp Key Check

on:
  workflow_dispatch:

jobs:
  check-key:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the stored key (no content printed)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" > /tmp/key.asc
          echo "byte count:"
          wc -c /tmp/key.asc
          echo "line count:"
          wc -l /tmp/key.asc
          echo "first line:"
          head -1 /tmp/key.asc
          echo "last line:"
          tail -1 /tmp/key.asc
          echo "---"
          echo "gpg --list-packets summary (structure only):"
          gpg --list-packets /tmp/key.asc 2>&1 | grep -E "^#|packet|version|algo" | head -30
          echo "---"
          echo "gpg --show-keys result:"
          gpg --show-keys /tmp/key.asc 2>&1
          rm -f /tmp/key.asc
